<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas CRM — S-Tier Creator CRM</title>
<style>
  /* ============================== THEME TOKENS ============================== */
  :root {
    --radius: 14px;
    --radius-sm: 9px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.10);
    --shadow-lg: 0 12px 48px rgba(0,0,0,.28);
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  [data-theme="dark"] {
    --bg: #0b0e14;
    --bg-soft: #111620;
    --surface: #151b27;
    --surface-2: #1b2230;
    --surface-3: #232c3d;
    --border: #232c3d;
    --border-soft: #1b2230;
    --text: #e8edf6;
    --text-dim: #9aa6bd;
    --text-faint: #67738c;
    --brand: #6d8bff;
    --brand-soft: rgba(109,139,255,.14);
    --brand-strong: #5570ff;
    --accent: #36d6c3;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --pink: #f472b6;
    --purple: #a78bfa;
  }
  [data-theme="light"] {
    --bg: #f5f7fb;
    --bg-soft: #eef1f7;
    --surface: #ffffff;
    --surface-2: #f7f9fc;
    --surface-3: #eef1f7;
    --border: #e3e8f0;
    --border-soft: #edf0f6;
    --text: #1a2233;
    --text-dim: #5a6680;
    --text-faint: #8a93a8;
    --brand: #4f6bff;
    --brand-soft: rgba(79,107,255,.10);
    --brand-strong: #3d57f0;
    --accent: #0fb6a3;
    --green: #16a34a;
    --amber: #d97706;
    --red: #dc2626;
    --pink: #db2777;
    --purple: #7c3aed;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.08);
    --shadow-lg: 0 12px 48px rgba(16,24,40,.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  ::selection { background: var(--brand-soft); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  a { color: var(--brand); text-decoration: none; }

  /* ============================== LAYOUT ============================== */
  .app { display: grid; grid-template-columns: 246px 1fr; height: 100vh; }

  /* Sidebar */
  .sidebar {
    background: var(--bg-soft);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 18px 14px;
    gap: 4px;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 6px 8px 18px; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--brand), var(--purple));
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 16px;
    box-shadow: 0 4px 14px var(--brand-soft);
  }
  .brand .name { font-weight: 700; font-size: 16px; letter-spacing: -.2px; }
  .brand .sub { font-size: 11px; color: var(--text-faint); margin-top: -2px; }
  .nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-faint); padding: 14px 10px 6px; font-weight: 600; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 11px; border-radius: var(--radius-sm);
    color: var(--text-dim); font-weight: 500; width: 100%; text-align: left;
    transition: background .15s, color .15s; position: relative;
  }
  .nav-item svg { width: 18px; height: 18px; flex: 0 0 18px; }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .nav-item .badge {
    margin-left: auto; background: var(--surface-3); color: var(--text-dim);
    font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 20px; min-width: 22px; text-align: center;
  }
  .nav-item.active .badge { background: var(--brand); color: #fff; }
  .sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }

  /* Main */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 62px; flex: 0 0 62px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; padding: 0 24px; background: var(--bg);
  }
  .topbar h1 { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
  .search {
    margin-left: auto; position: relative; width: 320px; max-width: 40vw;
  }
  .search input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px 9px 36px; outline: none; transition: border .15s, box-shadow .15s;
  }
  .search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-faint); }
  .search kbd {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; background: var(--surface-2);
  }

  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .view { display: none; animation: fade .25s var(--ease); }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
    padding: 9px 15px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    transition: background .15s, border .15s, transform .08s;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-strong); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger { color: var(--red); }
  .btn-danger:hover { background: rgba(248,113,113,.12); border-color: var(--red); }
  .btn-icon { padding: 9px; width: 38px; }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; border-radius: 8px; }

  /* ============================== DASHBOARD ============================== */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; position: relative; overflow: hidden;
  }
  .kpi .kpi-ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; margin-bottom: 14px; }
  .kpi .kpi-ico svg { width: 19px; height: 19px; }
  .kpi .val { font-size: 28px; font-weight: 760; letter-spacing: -.6px; }
  .kpi .label { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }
  .kpi .trend { font-size: 12px; font-weight: 600; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; }
  .trend.up { color: var(--green); } .trend.down { color: var(--red); }

  .dash-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px;
  }
  .card h3 { font-size: 14.5px; font-weight: 700; margin-bottom: 4px; }
  .card .card-sub { color: var(--text-faint); font-size: 12px; margin-bottom: 14px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-head h3 { margin: 0; }

  /* Funnel / pipeline bars */
  .funnel-row { display: flex; align-items: center; gap: 12px; margin-bottom: 13px; }
  .funnel-row .fl-name { width: 96px; font-size: 12.5px; color: var(--text-dim); font-weight: 500; }
  .funnel-row .fl-bar { flex: 1; height: 26px; background: var(--surface-2); border-radius: 7px; overflow: hidden; }
  .funnel-row .fl-fill { height: 100%; border-radius: 7px; display: flex; align-items: center; padding: 0 9px; color: #fff; font-size: 11.5px; font-weight: 700; min-width: 28px; transition: width .6s var(--ease); }
  .funnel-row .fl-val { width: 86px; text-align: right; font-size: 12.5px; font-weight: 600; }

  .timeline { display: flex; flex-direction: column; }
  .tl-item { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border-soft); }
  .tl-item:last-child { border-bottom: none; }
  .tl-dot { width: 30px; height: 30px; border-radius: 9px; flex: 0 0 30px; display: grid; place-items: center; }
  .tl-dot svg { width: 15px; height: 15px; }
  .tl-body { flex: 1; min-width: 0; }
  .tl-body .tl-main { font-size: 13px; }
  .tl-body .tl-main b { font-weight: 650; }
  .tl-body .tl-time { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }

  /* ============================== CONTACTS ============================== */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    padding: 6px 13px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    transition: all .14s;
  }
  .chip:hover { color: var(--text); border-color: var(--text-faint); }
  .chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .seg {
    display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px;
  }
  .seg button { padding: 6px 10px; border-radius: 6px; color: var(--text-dim); font-weight: 600; font-size: 12.5px; }
  .seg button.active { background: var(--surface-3); color: var(--text); }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .contact-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; cursor: pointer; transition: border .15s, transform .12s, box-shadow .15s; position: relative;
  }
  .contact-card:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: var(--shadow); }
  .cc-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 12px; flex: 0 0 44px; display: grid; place-items: center;
    font-weight: 700; color: #fff; font-size: 16px; letter-spacing: -.5px;
  }
  .avatar.sm { width: 32px; height: 32px; flex-basis: 32px; font-size: 12.5px; border-radius: 9px; }
  .avatar.lg { width: 64px; height: 64px; flex-basis: 64px; font-size: 24px; border-radius: 16px; }
  .cc-head .cc-name { font-weight: 680; font-size: 14.5px; letter-spacing: -.2px; }
  .cc-head .cc-co { font-size: 12px; color: var(--text-faint); }
  .cc-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tag {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 7px;
    background: var(--surface-2); color: var(--text-dim);
  }
  .pill {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .cc-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border-soft); }
  .cc-foot .val { font-weight: 720; font-size: 14px; }
  .cc-foot .when { font-size: 11.5px; color: var(--text-faint); }

  /* Table view */
  table.ctable { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .ctable thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-faint);
    font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); cursor: pointer; user-select: none; white-space: nowrap;
  }
  .ctable thead th:hover { color: var(--text); }
  .ctable tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border-soft); }
  .ctable tbody tr:last-child td { border-bottom: none; }
  .ctable tbody tr { cursor: pointer; transition: background .12s; }
  .ctable tbody tr:hover { background: var(--surface-2); }
  .td-name { display: flex; align-items: center; gap: 11px; }
  .td-name .nm { font-weight: 600; }
  .td-name .em { font-size: 12px; color: var(--text-faint); }

  /* ============================== PIPELINE (KANBAN) ============================== */
  .board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
  .col {
    flex: 0 0 290px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; max-height: calc(100vh - 200px);
  }
  .col-head { padding: 14px 15px 10px; display: flex; align-items: center; gap: 9px; }
  .col-head .dot { width: 9px; height: 9px; border-radius: 50%; }
  .col-head .ttl { font-weight: 700; font-size: 13.5px; }
  .col-head .cnt { margin-left: auto; font-size: 12px; color: var(--text-faint); font-weight: 600; background: var(--surface); padding: 1px 9px; border-radius: 20px; }
  .col-head .sum { font-size: 11.5px; color: var(--text-faint); font-weight: 600; }
  .col-body { padding: 4px 10px 12px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 9px; min-height: 60px; }
  .col-body.drag-over { background: var(--brand-soft); border-radius: 10px; }
  .deal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 12px; cursor: grab;
    transition: border .15s, box-shadow .15s, transform .08s;
  }
  .deal:hover { border-color: var(--brand); box-shadow: var(--shadow); }
  .deal.dragging { opacity: .5; cursor: grabbing; }
  .deal .d-head { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .deal .d-name { font-weight: 650; font-size: 13px; }
  .deal .d-co { font-size: 11.5px; color: var(--text-faint); }
  .deal .d-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .deal .d-val { font-weight: 720; font-size: 13.5px; color: var(--green); }

  /* ============================== TASKS ============================== */
  .task-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 9px; transition: border .15s;
  }
  .task-row:hover { border-color: var(--text-faint); }
  .task-row.done { opacity: .55; }
  .task-row.done .tk-title { text-decoration: line-through; }
  .check {
    width: 21px; height: 21px; border-radius: 7px; border: 2px solid var(--text-faint); flex: 0 0 21px;
    display: grid; place-items: center; transition: all .15s; cursor: pointer;
  }
  .check:hover { border-color: var(--brand); }
  .check.on { background: var(--brand); border-color: var(--brand); }
  .check svg { width: 12px; height: 12px; color: #fff; opacity: 0; }
  .check.on svg { opacity: 1; }
  .tk-body { flex: 1; min-width: 0; }
  .tk-title { font-weight: 600; font-size: 13.5px; }
  .tk-meta { font-size: 12px; color: var(--text-faint); margin-top: 2px; display: flex; gap: 10px; align-items: center; }
  .tk-due { font-weight: 600; font-size: 12px; padding: 3px 9px; border-radius: 7px; background: var(--surface-2); }
  .tk-due.overdue { color: var(--red); background: rgba(248,113,113,.12); }
  .tk-due.today { color: var(--amber); background: rgba(251,191,36,.12); }

  /* ============================== MODAL / DRAWER ============================== */
  .overlay {
    position: fixed; inset: 0; background: rgba(8,11,18,.55); backdrop-filter: blur(3px);
    display: none; z-index: 50; opacity: 0; transition: opacity .2s;
  }
  .overlay.show { display: block; opacity: 1; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100vh; width: 480px; max-width: 94vw;
    background: var(--surface); border-left: 1px solid var(--border); z-index: 60;
    transform: translateX(100%); transition: transform .28s var(--ease); display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg);
  }
  .drawer.show { transform: none; }
  .drawer-head { padding: 20px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 14px; }
  .drawer-body { padding: 20px 22px; overflow-y: auto; flex: 1; }
  .drawer-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; }

  .modal {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -46%) scale(.98); z-index: 60;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px; width: 560px; max-width: 94vw;
    max-height: 90vh; display: none; flex-direction: column; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .2s, transform .2s var(--ease);
  }
  .modal.show { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .modal-head { padding: 20px 24px 0; }
  .modal-head h2 { font-size: 19px; font-weight: 720; letter-spacing: -.3px; }
  .modal-head p { color: var(--text-faint); font-size: 13px; margin-top: 2px; }
  .modal-body { padding: 18px 24px; overflow-y: auto; }
  .modal-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; outline: none; transition: border .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: var(--surface); }
  .field textarea { resize: vertical; min-height: 78px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .detail-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-soft); font-size: 13.5px; }
  .detail-row .dl { width: 92px; color: var(--text-faint); flex: 0 0 92px; font-weight: 500; }
  .detail-row .dv { flex: 1; word-break: break-word; }
  .detail-sec-title { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--text-faint); font-weight: 700; margin: 22px 0 10px; }

  .activity-add { display: flex; gap: 8px; margin-bottom: 14px; }
  .activity-add input { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; outline: none; }
  .activity-add input:focus { border-color: var(--brand); }
  .act-item { display: flex; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
  .act-item:last-child { border: none; }
  .act-ico { width: 28px; height: 28px; border-radius: 8px; flex: 0 0 28px; display: grid; place-items: center; background: var(--surface-2); }
  .act-ico svg { width: 14px; height: 14px; color: var(--text-dim); }
  .act-txt { font-size: 13px; } .act-when { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }

  /* Empty state */
  .empty { text-align: center; padding: 70px 20px; color: var(--text-faint); }
  .empty .e-ico { width: 60px; height: 60px; border-radius: 18px; background: var(--surface-2); display: grid; place-items: center; margin: 0 auto 16px; }
  .empty .e-ico svg { width: 28px; height: 28px; color: var(--text-faint); }
  .empty h3 { color: var(--text); font-size: 16px; margin-bottom: 6px; }

  /* Toast */
  .toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 9px; align-items: center; }
  .toast {
    background: var(--surface-3); color: var(--text); border: 1px solid var(--border);
    padding: 11px 18px; border-radius: 11px; font-weight: 600; font-size: 13px; box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 9px; animation: toastIn .3s var(--ease);
  }
  .toast svg { width: 16px; height: 16px; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .dim { color: var(--text-dim); } .faint { color: var(--text-faint); }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .section-head .sh-sub { color: var(--text-faint); font-size: 13px; margin-top: 1px; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .dash-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<script>
/* =========================================================================
   ATLAS CRM — single-file creator CRM
   State persists to localStorage. No dependencies.
   ========================================================================= */
"use strict";

const LS_KEY = "atlas_crm_v1";
const THEME_KEY = "atlas_crm_theme";

/* ---------- Domain config ---------- */
const STAGES = [
  { id: "lead",       name: "Lead",        color: "#9aa6bd" },
  { id: "contacted",  name: "Contacted",   color: "#6d8bff" },
  { id: "negotiating",name: "Negotiating", color: "#a78bfa" },
  { id: "won",        name: "Won",         color: "#34d399" },
  { id: "lost",       name: "Lost",        color: "#f87171" },
];
const TYPES = [
  { id: "sponsor",      name: "Sponsor",      color: "#34d399" },
  { id: "collaborator", name: "Collaborator", color: "#6d8bff" },
  { id: "guest",        name: "Guest",        color: "#a78bfa" },
  { id: "client",       name: "Client",       color: "#fbbf24" },
  { id: "lead",         name: "Lead",         color: "#36d6c3" },
  { id: "fan",          name: "Superfan",     color: "#f472b6" },
];
const ACT_ICONS = {
  note:    '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
  email:   '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/>',
  call:    '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  meeting: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  dm:      '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  stage:   '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m22 4-10 10.01-3-3"/>',
  created: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 2"/>',
};

/* ---------- State ---------- */
let state = load();
let ui = { view: "dashboard", typeFilter: "all", contactLayout: "cards", sortKey: "updated", sortDir: -1, search: "", editingId: null, openId: null };

function uid() { return "c" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function now() { return Date.now(); }

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.warn("load failed", e); }
  return seed();
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { console.warn("save failed", e); }
}

/* ---------- Seed demo data ---------- */
function seed() {
  const day = 86400000;
  const t = now();
  const mk = (o) => Object.assign({
    id: uid(), createdAt: t, updatedAt: t, activity: [], tasks: [], tags: [], value: 0, stage: "lead",
    email: "", company: "", handle: "", phone: "", notes: "",
  }, o);
  const contacts = [
    mk({ name: "Justin Welsh", company: "The Saturday Solopreneur", type: "collaborator", stage: "negotiating", value: 12000, email: "justin@saturdaysolo.com", handle: "@thejustinwelsh", tags: ["newsletter","high-value"], notes: "Interested in a joint cohort. Big audience overlap.", createdAt: t - 40*day, updatedAt: t - 2*day,
      activity: [ {id:uid(), kind:"email", text:"Sent partnership proposal", at: t-2*day}, {id:uid(), kind:"call", text:"Intro call — great energy", at: t-9*day} ],
      tasks: [ {id:uid(), title:"Follow up on cohort terms", due: t+2*day, done:false} ] }),
    mk({ name: "Nicolas Cole", company: "Ship 30 for 30", type: "collaborator", stage: "contacted", value: 8000, email: "cole@ship30.com", handle: "@nicolascole77", tags: ["writing","course"], notes: "Open to a guest workshop swap.", createdAt: t-25*day, updatedAt: t-5*day,
      activity: [ {id:uid(), kind:"dm", text:"DM'd about workshop swap", at: t-5*day} ] }),
    mk({ name: "Kieran Drew", company: "Digital Writers", type: "guest", stage: "won", value: 0, email: "kieran@digitalwriters.co", handle: "@itskierandrew", tags: ["podcast","writing"], notes: "Recorded podcast ep — publishing next week.", createdAt: t-60*day, updatedAt: t-1*day,
      activity: [ {id:uid(), kind:"meeting", text:"Recorded podcast episode", at: t-1*day}, {id:uid(), kind:"note", text:"Confirmed availability", at: t-15*day} ] }),
    mk({ name: "Dan Koe", company: "Kortex / The Art of Focus", type: "collaborator", stage: "lead", value: 15000, email: "dan@thedankoe.com", handle: "@thedankoe", tags: ["high-value","product"], notes: "Cold outreach planned — Kortex integration angle.", createdAt: t-3*day, updatedAt: t-3*day,
      tasks: [ {id:uid(), title:"Draft cold outreach DM", due: t-1*day, done:false} ] }),
    mk({ name: "Notion", company: "Notion Labs", type: "sponsor", stage: "negotiating", value: 9500, email: "partnerships@notion.so", handle: "@NotionHQ", tags: ["sponsor","saas"], notes: "Q3 newsletter sponsorship — 2 slots.", createdAt: t-18*day, updatedAt: t-4*day,
      activity: [ {id:uid(), kind:"email", text:"Negotiating slot pricing", at: t-4*day} ],
      tasks: [ {id:uid(), title:"Send media kit + rates", due: t+1*day, done:false} ] }),
    mk({ name: "Riverside", company: "Riverside.fm", type: "sponsor", stage: "won", value: 6000, email: "deals@riverside.fm", handle: "@RiversideFM", tags: ["sponsor","podcast"], notes: "Signed — 3 podcast read-outs.", createdAt: t-30*day, updatedAt: t-7*day,
      activity: [ {id:uid(), kind:"note", text:"Contract signed 🎉", at: t-7*day} ] }),
    mk({ name: "Sara Chen", company: "Indie Hackers", type: "client", stage: "negotiating", value: 4500, email: "sara@indiehackers.com", handle: "@sarabuilds", tags: ["consulting"], notes: "Wants a content systems audit.", createdAt: t-12*day, updatedAt: t-6*day,
      tasks: [ {id:uid(), title:"Send consulting SOW", due: t+4*day, done:false} ] }),
    mk({ name: "Marcus Bell", company: "", type: "fan", stage: "lead", value: 0, email: "marcus.bell@gmail.com", handle: "@marcusbell", tags: ["superfan","community"], notes: "Replies to every email — potential testimonial.", createdAt: t-8*day, updatedAt: t-8*day }),
    mk({ name: "GrowthLoop", company: "GrowthLoop Media", type: "sponsor", stage: "lost", value: 7000, email: "hi@growthloop.io", tags: ["sponsor"], notes: "Budget paused for the quarter.", createdAt: t-45*day, updatedAt: t-20*day,
      activity: [ {id:uid(), kind:"email", text:"Passed for now — revisit Q4", at: t-20*day} ] }),
    mk({ name: "Priya Nair", company: "Creator Science", type: "guest", stage: "contacted", value: 0, email: "priya@creatorscience.com", handle: "@priyacreates", tags: ["podcast"], notes: "Pitched as podcast guest.", createdAt: t-6*day, updatedAt: t-6*day,
      tasks: [ {id:uid(), title:"Send recording link", due: t, done:false} ] }),
  ];
  return { contacts, settings: { currency: "$" } };
}

/* ===================================================================== */
/*  HELPERS                                                              */
/* ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = (n) => state.settings.currency + (n || 0).toLocaleString();
const typeOf = (id) => TYPES.find(t => t.id === id) || { name: "—", color: "#9aa6bd" };
const stageOf = (id) => STAGES.find(s => s.id === id) || STAGES[0];

function initials(name) {
  const p = String(name || "?").trim().split(/\s+/);
  return ((p[0]?.[0] || "") + (p[1]?.[0] || "")).toUpperCase() || "?";
}
const AV_COLORS = ["#6d8bff","#34d399","#a78bfa","#fbbf24","#f472b6","#36d6c3","#f87171","#60a5fa"];
function avatarColor(id) {
  let h = 0; for (const c of String(id)) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return AV_COLORS[h % AV_COLORS.length];
}
function relTime(ts) {
  if (!ts) return "—";
  const d = now() - ts, day = 86400000;
  if (d < 0) { const fd = Math.ceil(-d/day); return fd <= 1 ? "tomorrow" : `in ${fd}d`; }
  if (d < 3600000) { const m = Math.floor(d/60000); return m <= 1 ? "just now" : `${m}m ago`; }
  if (d < day) return `${Math.floor(d/3600000)}h ago`;
  if (d < 7*day) return `${Math.floor(d/day)}d ago`;
  return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function dueLabel(ts) {
  const day = 86400000, d0 = new Date(); d0.setHours(0,0,0,0);
  const due = new Date(ts); due.setHours(0,0,0,0);
  const diff = Math.round((due - d0) / day);
  if (diff < 0) return { txt: `${-diff}d overdue`, cls: "overdue" };
  if (diff === 0) return { txt: "Due today", cls: "today" };
  if (diff === 1) return { txt: "Due tomorrow", cls: "" };
  return { txt: `Due in ${diff}d`, cls: "" };
}
const avatar = (c, cls="") => `<div class="avatar ${cls}" style="background:${avatarColor(c.id)}">${esc(initials(c.name))}</div>`;
const typePill = (id) => { const t = typeOf(id); return `<span class="pill" style="color:${t.color};background:${t.color}1f">${esc(t.name)}</span>`; };

/* ===================================================================== */
/*  TOASTS                                                               */
/* ===================================================================== */
function toast(msg, kind="ok") {
  const el = document.createElement("div");
  el.className = "toast";
  const ico = kind === "ok"
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  el.innerHTML = ico + esc(msg);
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s, transform .3s"; el.style.opacity = "0"; el.style.transform = "translateY(10px)"; setTimeout(() => el.remove(), 300); }, 2400);
}

/* ===================================================================== */
/*  NAV                                                                  */
/* ===================================================================== */
const NAV = [
  { id: "dashboard", label: "Dashboard", icon: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>' },
  { id: "contacts", label: "Contacts", icon: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>' },
  { id: "pipeline", label: "Pipeline", icon: '<path d="M3 3v18h18"/><rect x="7" y="9" width="3" height="8" rx="1"/><rect x="12" y="5" width="3" height="12" rx="1"/><rect x="17" y="12" width="3" height="5" rx="1"/>' },
  { id: "tasks", label: "Tasks", icon: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>' },
];
function renderNav() {
  const openTasks = state.contacts.reduce((n, c) => n + (c.tasks||[]).filter(t => !t.done).length, 0);
  const activeDeals = state.contacts.filter(c => c.stage !== "won" && c.stage !== "lost").length;
  $("#nav").innerHTML = '<div class="nav-label">Workspace</div>' + NAV.map(n => {
    let badge = "";
    if (n.id === "contacts") badge = `<span class="badge">${state.contacts.length}</span>`;
    if (n.id === "tasks" && openTasks) badge = `<span class="badge">${openTasks}</span>`;
    if (n.id === "pipeline" && activeDeals) badge = `<span class="badge">${activeDeals}</span>`;
    return `<button class="nav-item ${ui.view===n.id?"active":""}" data-view="${n.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${n.icon}</svg>
      <span>${n.label}</span>${badge}</button>`;
  }).join("");
  $$("#nav .nav-item").forEach(b => b.onclick = () => switchView(b.dataset.view));
}
function switchView(v) {
  ui.view = v;
  $$(".view").forEach(el => el.classList.toggle("active", el.id === "view-"+v));
  $("#viewTitle").textContent = NAV.find(n => n.id===v)?.label || "";
  renderNav();
  render();
}

/* ===================================================================== */
/*  RENDER ROUTER                                                        */
/* ===================================================================== */
function render() {
  renderNav();
  if (ui.view === "dashboard") renderDashboard();
  else if (ui.view === "contacts") renderContacts();
  else if (ui.view === "pipeline") renderPipeline();
  else if (ui.view === "tasks") renderTasks();
}

/* ===================================================================== */
/*  DASHBOARD                                                            */
/* ===================================================================== */
function renderDashboard() {
  const cs = state.contacts;
  const openDeals = cs.filter(c => c.stage !== "won" && c.stage !== "lost");
  const pipelineVal = openDeals.reduce((s, c) => s + (+c.value||0), 0);
  const wonVal = cs.filter(c => c.stage === "won").reduce((s, c) => s + (+c.value||0), 0);
  const openTasks = cs.flatMap(c => (c.tasks||[]).filter(t => !t.done).map(t => ({ ...t, c })));
  const overdue = openTasks.filter(t => { const d=new Date(t.due); d.setHours(0,0,0,0); const n=new Date(); n.setHours(0,0,0,0); return d < n; }).length;

  const kpi = (ico, color, val, label, trend) => `
    <div class="kpi">
      <div class="kpi-ico" style="background:${color}1f;color:${color}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ico}</svg>
      </div>
      <div class="val">${val}</div>
      <div class="label">${label}</div>
      ${trend || ""}
    </div>`;

  const kpis = `
    <div class="kpis">
      ${kpi('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>', "#6d8bff", cs.length, "Total contacts", `<div class="trend up">▲ ${cs.filter(c=>now()-c.createdAt < 14*86400000).length} new this fortnight</div>`)}
      ${kpi('<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>', "#a78bfa", openDeals.length, "Active deals", `<div class="trend dim faint" style="color:var(--text-faint)">${cs.filter(c=>c.stage==="negotiating").length} negotiating</div>`)}
      ${kpi('<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>', "#34d399", money(pipelineVal), "Pipeline value", `<div class="trend up">${money(wonVal)} won</div>`)}
      ${kpi('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>', overdue?"#f87171":"#fbbf24", openTasks.length, "Open tasks", overdue?`<div class="trend down">${overdue} overdue</div>`:`<div class="trend" style="color:var(--green)">All on track</div>`)}
    </div>`;

  // Funnel
  const maxStage = Math.max(1, ...STAGES.map(s => cs.filter(c => c.stage === s.id).length));
  const funnel = STAGES.map(s => {
    const list = cs.filter(c => c.stage === s.id);
    const val = list.reduce((a, c) => a + (+c.value||0), 0);
    const pct = (list.length / maxStage) * 100;
    return `<div class="funnel-row">
      <div class="fl-name">${s.name}</div>
      <div class="fl-bar"><div class="fl-fill" style="width:${Math.max(pct,7)}%;background:${s.color}">${list.length}</div></div>
      <div class="fl-val">${money(val)}</div>
    </div>`;
  }).join("");

  // Recent activity (flatten)
  const acts = cs.flatMap(c => (c.activity||[]).map(a => ({ ...a, c }))).sort((a,b) => b.at - a.at).slice(0, 7);
  const timeline = acts.length ? acts.map(a => `
    <div class="tl-item">
      <div class="tl-dot" style="background:${avatarColor(a.c.id)}1f;color:${avatarColor(a.c.id)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ACT_ICONS[a.kind]||ACT_ICONS.note}</svg>
      </div>
      <div class="tl-body">
        <div class="tl-main"><b>${esc(a.c.name)}</b> · ${esc(a.text)}</div>
        <div class="tl-time">${relTime(a.at)}</div>
      </div>
    </div>`).join("") : `<div class="faint" style="padding:20px 0;text-align:center">No activity yet</div>`;

  // Upcoming follow-ups
  const upcoming = openTasks.sort((a,b) => a.due - b.due).slice(0, 5);
  const followups = upcoming.length ? upcoming.map(t => {
    const dl = dueLabel(t.due);
    return `<div class="tl-item" style="cursor:pointer" data-open="${t.c.id}">
      ${avatar(t.c, "sm")}
      <div class="tl-body"><div class="tl-main">${esc(t.title)}</div><div class="tl-time">${esc(t.c.name)}</div></div>
      <div class="tk-due ${dl.cls}" style="align-self:center">${dl.txt}</div>
    </div>`;
  }).join("") : `<div class="faint" style="padding:20px 0;text-align:center">No follow-ups scheduled 🎉</div>`;

  $("#view-dashboard").innerHTML = kpis + `
    <div class="dash-grid">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <div class="card-head"><div><h3>Pipeline funnel</h3></div><span class="faint" style="font-size:12px">${money(pipelineVal+wonVal)} total</span></div>
          ${funnel}
        </div>
        <div class="card">
          <div class="card-head"><h3>Upcoming follow-ups</h3><button class="btn btn-sm btn-ghost" data-goto="tasks">View all</button></div>
          <div class="timeline">${followups}</div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Recent activity</h3></div>
        <div class="timeline">${timeline}</div>
      </div>
    </div>`;

  $$('#view-dashboard [data-open]').forEach(el => el.onclick = () => openContact(el.dataset.open));
  $$('#view-dashboard [data-goto]').forEach(el => el.onclick = () => switchView(el.dataset.goto));
}

/* ===================================================================== */
/*  CONTACTS                                                             */
/* ===================================================================== */
function filteredContacts() {
  let list = state.contacts.slice();
  if (ui.typeFilter !== "all") list = list.filter(c => c.type === ui.typeFilter);
  const q = ui.search.trim().toLowerCase();
  if (q) list = list.filter(c =>
    [c.name, c.company, c.email, c.handle, c.notes, (c.tags||[]).join(" ")].join(" ").toLowerCase().includes(q));
  const k = ui.sortKey;
  list.sort((a, b) => {
    let av, bv;
    if (k === "name") { av = (a.name||"").toLowerCase(); bv = (b.name||"").toLowerCase(); }
    else if (k === "value") { av = +a.value||0; bv = +b.value||0; }
    else if (k === "updated") { av = a.updatedAt; bv = b.updatedAt; }
    else { av = a[k]; bv = b[k]; }
    return (av < bv ? -1 : av > bv ? 1 : 0) * ui.sortDir;
  });
  return list;
}

function renderContacts() {
  const counts = { all: state.contacts.length };
  TYPES.forEach(t => counts[t.id] = state.contacts.filter(c => c.type === t.id).length);
  const chips = `<button class="chip ${ui.typeFilter==='all'?'active':''}" data-type="all">All <span class="dim">${counts.all}</span></button>` +
    TYPES.filter(t => counts[t.id]).map(t => `<button class="chip ${ui.typeFilter===t.id?'active':''}" data-type="${t.id}">${t.name} <span class="dim">${counts[t.id]}</span></button>`).join("");

  const list = filteredContacts();
  const body = list.length ? (ui.contactLayout === "cards" ? contactCards(list) : contactTable(list)) : emptyState("contacts");

  $("#view-contacts").innerHTML = `
    <div class="toolbar">
      <div class="chips">${chips}</div>
      <div style="margin-left:auto;display:flex;gap:10px">
        <div class="seg">
          <button class="${ui.contactLayout==='cards'?'active':''}" data-layout="cards">Cards</button>
          <button class="${ui.contactLayout==='table'?'active':''}" data-layout="table">Table</button>
        </div>
      </div>
    </div>
    <div id="contactBody">${body}</div>`;

  $$('#view-contacts .chip').forEach(c => c.onclick = () => { ui.typeFilter = c.dataset.type; renderContacts(); });
  $$('#view-contacts [data-layout]').forEach(b => b.onclick = () => { ui.contactLayout = b.dataset.layout; renderContacts(); });
  bindContactClicks();
}

function contactCards(list) {
  return `<div class="grid-cards">` + list.map(c => `
    <div class="contact-card" data-open="${c.id}">
      <div class="cc-head">
        ${avatar(c)}
        <div style="min-width:0">
          <div class="cc-name">${esc(c.name)}</div>
          <div class="cc-co">${esc(c.company || c.handle || "—")}</div>
        </div>
      </div>
      <div class="cc-meta">${typePill(c.type)}${(c.tags||[]).slice(0,2).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="cc-foot">
        <span class="val">${c.value ? money(c.value) : '<span class="faint" style="font-weight:500">No deal</span>'}</span>
        <span class="when">${relTime(c.updatedAt)}</span>
      </div>
    </div>`).join("") + `</div>`;
}

function contactTable(list) {
  const arrow = (k) => ui.sortKey===k ? (ui.sortDir<0?" ↓":" ↑") : "";
  return `<table class="ctable"><thead><tr>
    <th data-sort="name">Name${arrow("name")}</th>
    <th data-sort="type">Type${arrow("type")}</th>
    <th data-sort="stage">Stage${arrow("stage")}</th>
    <th data-sort="value">Value${arrow("value")}</th>
    <th>Tags</th>
    <th data-sort="updated">Updated${arrow("updated")}</th>
  </tr></thead><tbody>` + list.map(c => {
    const st = stageOf(c.stage);
    return `<tr data-open="${c.id}">
      <td><div class="td-name">${avatar(c,"sm")}<div><div class="nm">${esc(c.name)}</div><div class="em">${esc(c.email||c.company||"—")}</div></div></div></td>
      <td>${typePill(c.type)}</td>
      <td><span class="pill" style="color:${st.color};background:${st.color}1f">${st.name}</span></td>
      <td style="font-weight:650">${c.value?money(c.value):'<span class="faint">—</span>'}</td>
      <td>${(c.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join(" ")||'<span class="faint">—</span>'}</td>
      <td class="faint">${relTime(c.updatedAt)}</td>
    </tr>`;
  }).join("") + `</tbody></table>`;
}

function bindContactClicks() {
  $$('#view-contacts [data-open]').forEach(el => el.onclick = () => openContact(el.dataset.open));
  $$('#view-contacts th[data-sort]').forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if (ui.sortKey === k) ui.sortDir *= -1; else { ui.sortKey = k; ui.sortDir = (k==="name"||k==="type"||k==="stage")?1:-1; }
    renderContacts();
  });
}

function emptyState(view) {
  const map = {
    contacts: { ico: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>', h: "No contacts found", p: ui.search ? "Try a different search or filter." : "Add your first contact to get started." },
    tasks: { ico: '<path d="M9 11l3 3L22 4"/>', h: "No tasks here", p: "You're all caught up. Nice work." },
  };
  const m = map[view] || map.contacts;
  return `<div class="empty"><div class="e-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${m.ico}</svg></div><h3>${m.h}</h3><p>${m.p}</p></div>`;
}

/* ===================================================================== */
/*  PIPELINE (KANBAN)                                                    */
/* ===================================================================== */
function renderPipeline() {
  const q = ui.search.trim().toLowerCase();
  const cols = STAGES.map(s => {
    const list = state.contacts.filter(c => c.stage === s.id && (!q || [c.name,c.company,(c.tags||[]).join(" ")].join(" ").toLowerCase().includes(q)));
    const sum = list.reduce((a, c) => a + (+c.value||0), 0);
    const deals = list.map(c => `
      <div class="deal" draggable="true" data-id="${c.id}">
        <div class="d-head">${avatar(c,"sm")}<div style="min-width:0"><div class="d-name">${esc(c.name)}</div><div class="d-co">${esc(c.company||c.handle||"—")}</div></div></div>
        <div class="cc-meta" style="margin:0">${typePill(c.type)}${(c.tags||[]).slice(0,1).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
        <div class="d-foot"><span class="d-val">${c.value?money(c.value):'<span class="faint" style="font-weight:500">—</span>'}</span><span class="when faint" style="font-size:11px">${relTime(c.updatedAt)}</span></div>
      </div>`).join("");
    return `<div class="col" data-stage="${s.id}">
      <div class="col-head"><span class="dot" style="background:${s.color}"></span><span class="ttl">${s.name}</span><span class="cnt">${list.length}</span></div>
      <div style="padding:0 15px 8px"><span class="sum">${money(sum)}</span></div>
      <div class="col-body" data-stage="${s.id}">${deals || ''}</div>
    </div>`;
  }).join("");

  $("#view-pipeline").innerHTML = `
    <div class="section-head"><div><div class="sh-sub">Drag deals between stages to update them.</div></div></div>
    <div class="board">${cols}</div>`;

  $$('#view-pipeline .deal').forEach(d => {
    d.onclick = (e) => { if (!d.classList.contains("just-dragged")) openContact(d.dataset.id); };
    d.ondragstart = (e) => { d.classList.add("dragging"); e.dataTransfer.setData("text/plain", d.dataset.id); e.dataTransfer.effectAllowed = "move"; };
    d.ondragend = () => { d.classList.add("just-dragged"); setTimeout(()=>d.classList.remove("just-dragged"),50); d.classList.remove("dragging"); };
  });
  $$('#view-pipeline .col-body').forEach(col => {
    col.ondragover = (e) => { e.preventDefault(); col.classList.add("drag-over"); };
    col.ondragleave = () => col.classList.remove("drag-over");
    col.ondrop = (e) => {
      e.preventDefault(); col.classList.remove("drag-over");
      const id = e.dataTransfer.getData("text/plain");
      const c = state.contacts.find(x => x.id === id);
      const newStage = col.dataset.stage;
      if (c && c.stage !== newStage) {
        const old = stageOf(c.stage).name;
        c.stage = newStage; c.updatedAt = now();
        (c.activity ||= []).unshift({ id: uid(), kind: "stage", text: `Moved ${old} → ${stageOf(newStage).name}`, at: now() });
        save(); render();
        toast(`${c.name} → ${stageOf(newStage).name}`);
      }
    };
  });
}

/* ===================================================================== */
/*  TASKS                                                                */
/* ===================================================================== */
function renderTasks() {
  const all = state.contacts.flatMap(c => (c.tasks||[]).map(t => ({ ...t, c })));
  const open = all.filter(t => !t.done).sort((a,b) => a.due - b.due);
  const done = all.filter(t => t.done).sort((a,b) => b.due - a.due);

  const row = (t) => {
    const dl = dueLabel(t.due);
    return `<div class="task-row ${t.done?'done':''}">
      <div class="check ${t.done?'on':''}" data-toggle="${t.c.id}:${t.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="tk-body">
        <div class="tk-title">${esc(t.title)}</div>
        <div class="tk-meta"><span data-open="${t.c.id}" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px">${avatar(t.c,"sm")}<span style="font-weight:600;color:var(--text-dim)">${esc(t.c.name)}</span></span></div>
      </div>
      ${!t.done ? `<div class="tk-due ${dl.cls}">${dl.txt}</div>` : `<span class="faint" style="font-size:12px">Done</span>`}
      <button class="btn btn-icon btn-ghost btn-danger" data-deltask="${t.c.id}:${t.id}" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>`;
  };

  $("#view-tasks").innerHTML = `
    <div class="section-head">
      <div><div class="sh-sub">${open.length} open · ${done.length} completed</div></div>
      <button class="btn btn-primary btn-sm" id="addTaskBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg> Add task</button>
    </div>
    ${open.length ? open.map(row).join("") : emptyState("tasks")}
    ${done.length ? `<div class="detail-sec-title" style="margin-top:26px">Completed</div>` + done.map(row).join("") : ""}`;

  $$('#view-tasks [data-toggle]').forEach(el => el.onclick = () => toggleTask(el.dataset.toggle));
  $$('#view-tasks [data-deltask]').forEach(el => el.onclick = () => deleteTask(el.dataset.deltask));
  $$('#view-tasks [data-open]').forEach(el => el.onclick = () => openContact(el.dataset.open));
  $("#addTaskBtn").onclick = () => quickAddTask();
}

function toggleTask(ref) {
  const [cid, tid] = ref.split(":");
  const c = state.contacts.find(x => x.id === cid); if (!c) return;
  const t = (c.tasks||[]).find(x => x.id === tid); if (!t) return;
  t.done = !t.done; c.updatedAt = now(); save(); render();
  if (t.done) toast("Task completed ✓");
}
function deleteTask(ref) {
  const [cid, tid] = ref.split(":");
  const c = state.contacts.find(x => x.id === cid); if (!c) return;
  c.tasks = (c.tasks||[]).filter(x => x.id !== tid); c.updatedAt = now(); save(); render();
  if (ui.openId === cid) openContact(cid);
}
function quickAddTask() {
  if (!state.contacts.length) return toast("Add a contact first", "err");
  const opts = state.contacts.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  openModal("#contactModal", `
    <div class="modal-head"><h2>New task</h2><p>Schedule a follow-up tied to a contact.</p></div>
    <div class="modal-body">
      <div class="field"><label>Task</label><input id="qt_title" placeholder="e.g. Send sponsorship rates" /></div>
      <div class="field-row">
        <div class="field"><label>Contact</label><select id="qt_contact">${opts}</select></div>
        <div class="field"><label>Due date</label><input id="qt_due" type="date" value="${new Date(now()+2*86400000).toISOString().slice(0,10)}" /></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="qt_save">Add task</button></div>`);
  $("#qt_save").onclick = () => {
    const title = $("#qt_title").value.trim(); if (!title) return toast("Enter a task", "err");
    const c = state.contacts.find(x => x.id === $("#qt_contact").value); if (!c) return;
    (c.tasks ||= []).push({ id: uid(), title, due: new Date($("#qt_due").value).getTime() || now(), done: false });
    c.updatedAt = now(); save(); closeAll(); render(); toast("Task added");
  };
  setTimeout(() => $("#qt_title")?.focus(), 50);
}

/* ===================================================================== */
/*  CONTACT DRAWER (detail)                                              */
/* ===================================================================== */
function openContact(id) {
  const c = state.contacts.find(x => x.id === id); if (!c) return;
  ui.openId = id;
  const st = stageOf(c.stage), ty = typeOf(c.type);
  const tasks = (c.tasks||[]).slice().sort((a,b)=>a.due-b.due);
  const acts = (c.activity||[]).slice().sort((a,b)=>b.at-a.at);

  const drawer = $("#drawer");
  drawer.innerHTML = `
    <div class="drawer-head">
      ${avatar(c,"lg")}
      <div style="flex:1;min-width:0">
        <div style="font-size:20px;font-weight:720;letter-spacing:-.3px">${esc(c.name)}</div>
        <div class="faint" style="font-size:13px">${esc(c.company || "—")}</div>
        <div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">${typePill(c.type)}<span class="pill" style="color:${st.color};background:${st.color}1f">${st.name}</span></div>
      </div>
      <button class="btn btn-icon btn-ghost" data-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="drawer-body">
      <div style="display:flex;gap:8px;margin-bottom:6px">
        <button class="btn btn-sm" id="dr_edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit</button>
        ${c.email?`<a class="btn btn-sm" href="mailto:${esc(c.email)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg> Email</a>`:""}
        <button class="btn btn-sm btn-danger" id="dr_del" style="margin-left:auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div>

      <div class="detail-sec-title">Details</div>
      ${c.email?detailRow("Email", `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`):""}
      ${c.phone?detailRow("Phone", esc(c.phone)):""}
      ${c.handle?detailRow("Social", esc(c.handle)):""}
      ${detailRow("Deal value", c.value?`<b>${money(c.value)}</b>`:'<span class="faint">No deal</span>')}
      ${(c.tags||[]).length?detailRow("Tags", (c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join(" ")):""}
      ${detailRow("Added", new Date(c.createdAt).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}))}
      ${c.notes?`<div class="detail-sec-title">Notes</div><div style="font-size:13.5px;line-height:1.6;color:var(--text-dim)">${esc(c.notes).replace(/\n/g,"<br>")}</div>`:""}

      <div class="detail-sec-title">Tasks</div>
      <div class="activity-add"><input id="dr_task" placeholder="Add a follow-up task…" /><button class="btn btn-sm btn-primary" id="dr_taskadd">Add</button></div>
      ${tasks.length ? tasks.map(t => {
        const dl = dueLabel(t.due);
        return `<div class="act-item" style="align-items:center">
          <div class="check ${t.done?'on':''}" data-drtoggle="${t.id}" style="width:19px;height:19px;flex-basis:19px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></div>
          <div class="act-txt" style="flex:1;${t.done?'text-decoration:line-through;opacity:.6':''}">${esc(t.title)}</div>
          ${!t.done?`<span class="tk-due ${dl.cls}" style="font-size:11px">${dl.txt}</span>`:""}
        </div>`;
      }).join("") : `<div class="faint" style="font-size:13px;padding:4px 0">No tasks yet.</div>`}

      <div class="detail-sec-title">Activity</div>
      <div class="activity-add">
        <input id="dr_act" placeholder="Log a note, call, email…" />
        <button class="btn btn-sm btn-primary" id="dr_actadd">Log</button>
      </div>
      ${acts.length ? acts.map(a => `
        <div class="act-item">
          <div class="act-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ACT_ICONS[a.kind]||ACT_ICONS.note}</svg></div>
          <div style="flex:1"><div class="act-txt">${esc(a.text)}</div><div class="act-when">${relTime(a.at)}</div></div>
        </div>`).join("") : `<div class="faint" style="font-size:13px;padding:4px 0">No activity logged.</div>`}
    </div>`;

  // bind
  $("#dr_edit").onclick = () => openContactForm(c.id);
  $("#dr_del").onclick = () => { if (confirm(`Delete ${c.name}? This can't be undone.`)) { state.contacts = state.contacts.filter(x=>x.id!==id); save(); closeAll(); render(); toast("Contact deleted"); } };
  const addTask = () => { const v=$("#dr_task").value.trim(); if(!v) return; (c.tasks||=[]).push({id:uid(),title:v,due:now()+2*86400000,done:false}); c.updatedAt=now(); save(); openContact(id); render(); };
  $("#dr_taskadd").onclick = addTask;
  $("#dr_task").onkeydown = (e) => { if (e.key==="Enter") addTask(); };
  const addAct = () => { const v=$("#dr_act").value.trim(); if(!v) return; (c.activity||=[]).unshift({id:uid(),kind:"note",text:v,at:now()}); c.updatedAt=now(); save(); openContact(id); render(); };
  $("#dr_actadd").onclick = addAct;
  $("#dr_act").onkeydown = (e) => { if (e.key==="Enter") addAct(); };
  $$('#drawer [data-drtoggle]').forEach(el => el.onclick = () => { const t=(c.tasks||[]).find(x=>x.id===el.dataset.drtoggle); if(t){t.done=!t.done; c.updatedAt=now(); save(); openContact(id); render();} });
  $$('#drawer [data-close]').forEach(el => el.onclick = closeAll);

  $("#overlay").classList.add("show");
  drawer.classList.add("show");
}
function detailRow(label, val) { return `<div class="detail-row"><div class="dl">${label}</div><div class="dv">${val}</div></div>`; }

/* ===================================================================== */
/*  CONTACT FORM (create / edit)                                         */
/* ===================================================================== */
function openContactForm(id) {
  const c = id ? state.contacts.find(x => x.id === id) : null;
  ui.editingId = id || null;
  const typeOpts = TYPES.map(t => `<option value="${t.id}" ${c&&c.type===t.id?"selected":""}>${t.name}</option>`).join("");
  const stageOpts = STAGES.map(s => `<option value="${s.id}" ${c&&c.stage===s.id?"selected":(!c&&s.id==="lead"?"selected":"")}>${s.name}</option>`).join("");
  openModal("#contactModal", `
    <div class="modal-head"><h2>${c?"Edit contact":"New contact"}</h2><p>${c?"Update the details for "+esc(c.name)+".":"Add someone to your relationship network."}</p></div>
    <div class="modal-body">
      <div class="field"><label>Name *</label><input id="f_name" value="${c?esc(c.name):""}" placeholder="Full name" /></div>
      <div class="field-row">
        <div class="field"><label>Company / brand</label><input id="f_company" value="${c?esc(c.company):""}" placeholder="Optional" /></div>
        <div class="field"><label>Social handle</label><input id="f_handle" value="${c?esc(c.handle):""}" placeholder="@username" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Email</label><input id="f_email" type="email" value="${c?esc(c.email):""}" placeholder="name@email.com" /></div>
        <div class="field"><label>Phone</label><input id="f_phone" value="${c?esc(c.phone):""}" placeholder="Optional" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Type</label><select id="f_type">${typeOpts}</select></div>
        <div class="field"><label>Stage</label><select id="f_stage">${stageOpts}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Deal value (${state.settings.currency})</label><input id="f_value" type="number" min="0" value="${c?(c.value||0):0}" /></div>
        <div class="field"><label>Tags (comma-separated)</label><input id="f_tags" value="${c?esc((c.tags||[]).join(", ")):""}" placeholder="newsletter, high-value" /></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Context, history, next steps…">${c?esc(c.notes):""}</textarea></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="f_save">${c?"Save changes":"Create contact"}</button></div>`);

  $("#f_save").onclick = saveContactForm;
  setTimeout(() => $("#f_name")?.focus(), 50);
}

function saveContactForm() {
  const name = $("#f_name").value.trim();
  if (!name) return toast("Name is required", "err");
  const data = {
    name,
    company: $("#f_company").value.trim(),
    handle: $("#f_handle").value.trim(),
    email: $("#f_email").value.trim(),
    phone: $("#f_phone").value.trim(),
    type: $("#f_type").value,
    stage: $("#f_stage").value,
    value: +$("#f_value").value || 0,
    tags: $("#f_tags").value.split(",").map(s => s.trim()).filter(Boolean),
    notes: $("#f_notes").value.trim(),
    updatedAt: now(),
  };
  if (ui.editingId) {
    const c = state.contacts.find(x => x.id === ui.editingId);
    const stageChanged = c.stage !== data.stage;
    Object.assign(c, data);
    if (stageChanged) (c.activity ||= []).unshift({ id: uid(), kind: "stage", text: `Stage set to ${stageOf(data.stage).name}`, at: now() });
    save(); closeAll(); render(); openContact(c.id); toast("Contact updated");
  } else {
    const c = Object.assign({ id: uid(), createdAt: now(), activity: [{ id: uid(), kind: "created", text: "Contact created", at: now() }], tasks: [] }, data);
    state.contacts.unshift(c);
    save(); closeAll(); render(); toast(`${name} added`);
  }
}

function openIO() {
  openModal("#ioModal", `
    <div class="modal-head"><h2>Export / Import</h2><p>Back up your CRM or move it between devices.</p></div>
    <div class="modal-body">
      <div class="detail-sec-title" style="margin-top:0">Export</div>
      <div style="display:flex;gap:10px;margin-bottom:8px">
        <button class="btn" id="io_json"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Download JSON</button>
        <button class="btn" id="io_csv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg> Download CSV</button>
      </div>
      <p class="faint" style="font-size:12.5px">JSON includes everything (activity, tasks). CSV is contacts only — good for spreadsheets.</p>

      <div class="detail-sec-title">Import JSON</div>
      <p class="faint" style="font-size:12.5px;margin-bottom:8px">Replaces your current data with a previously exported JSON file.</p>
      <input type="file" id="io_file" accept="application/json,.json" class="btn" style="width:100%;cursor:pointer" />

      <div class="detail-sec-title" style="color:var(--red)">Danger zone</div>
      <button class="btn btn-danger" id="io_reset">Reset to demo data</button>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Close</button></div>`);

  $("#io_json").onclick = () => { downloadFile(`atlas-crm-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(state, null, 2), "application/json"); toast("JSON exported"); };
  $("#io_csv").onclick = exportCSV;
  $("#io_file").onchange = (e) => importJSON(e.target.files[0]);
  $("#io_reset").onclick = () => { if (confirm("Reset everything to demo data? Your current data will be lost.")) { state = seed(); save(); closeAll(); render(); toast("Reset to demo data"); } };
}
function downloadFile(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportCSV() {
  const cols = ["name","company","type","stage","value","email","phone","handle","tags","notes"];
  const rows = [cols.join(",")].concat(state.contacts.map(c =>
    cols.map(k => {
      let v = k === "tags" ? (c.tags||[]).join("; ") : c[k];
      v = String(v == null ? "" : v).replace(/"/g, '""');
      return /[",\n]/.test(v) ? `"${v}"` : v;
    }).join(",")));
  downloadFile(`atlas-crm-${new Date().toISOString().slice(0,10)}.csv`, rows.join("\n"), "text/csv");
  toast("CSV exported");
}
function importJSON(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.contacts)) throw new Error("bad format");
      state = data; state.settings ||= { currency: "$" };
      save(); closeAll(); render(); toast(`Imported ${data.contacts.length} contacts`);
    } catch (e) { toast("Invalid JSON file", "err"); }
  };
  reader.readAsText(file);
}

/* ===================================================================== */
/*  MODAL / OVERLAY PLUMBING                                             */
/* ===================================================================== */
function openModal(sel, html) {
  closeAll(true);
  const m = $(sel); m.innerHTML = html;
  $("#overlay").classList.add("show");
  m.classList.add("show");
  $$(`${sel} [data-close]`).forEach(el => el.onclick = closeAll);
}
function closeAll(keepOverlay) {
  $("#drawer").classList.remove("show");
  $("#contactModal").classList.remove("show");
  $("#ioModal").classList.remove("show");
  if (!keepOverlay) $("#overlay").classList.remove("show");
  ui.openId = null; ui.editingId = null;
}

/* ===================================================================== */
/*  GLOBAL EVENTS                                                        */
/* ===================================================================== */
$("#overlay").onclick = () => closeAll();
$("#newContactBtn").onclick = () => openContactForm(null);
$("#exportBtn").onclick = openIO;
$("#themeToggle").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem(THEME_KEY, next);
};
const searchEl = $("#globalSearch");
searchEl.oninput = () => {
  ui.search = searchEl.value;
  if (ui.view === "contacts") renderContacts();
  else if (ui.view === "pipeline") renderPipeline();
  else if (ui.search && ui.view !== "contacts") switchView("contacts");
};

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeAll();
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); searchEl.focus(); }
  else if (e.key === "n") { e.preventDefault(); openContactForm(null); }
  else if (e.key === "1") switchView("dashboard");
  else if (e.key === "2") switchView("contacts");
  else if (e.key === "3") switchView("pipeline");
  else if (e.key === "4") switchView("tasks");
});

/* ---------- Boot ---------- */
(function init() {
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  render();
})();
</script>
</body>
</html>
